<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DSouza Estética</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f4f7fb;
            --bg-sidebar: linear-gradient(180deg, #1f2f3d 0%, #162534 100%);
            --text-sidebar: #ecf0f1;
            --primary: #e67e22;
            --primary-hover: #d35400;
            --text-main: #233446;
            --card-bg: #ffffff;
            --border-color: #e7edf3;
            --shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #f4f7fb 0%, #eef5f8 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        .app-shell {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .login-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(22, 37, 52, 0.95), rgba(44, 62, 80, 0.95));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.2);
        }
        .login-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #233446;
        }
        .login-card p { color: #6b7280; margin-bottom: 18px; }
        .login-card input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #dbe4ee;
            border-radius: 10px;
            font-size: 14px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, #f39c12 100%);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .login-message {
            margin-top: 12px;
            font-size: 13px;
            color: #e74c3c;
            min-height: 20px;
        }
        .hidden { display: none !important; }

        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            color: var(--text-sidebar);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            min-height: 100vh;
            box-shadow: 10px 0 30px rgba(15, 23, 42, 0.15);
        }
        .brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }
        .brand span { color: #fff; font-weight: 500; }
        .nav-links { list-style: none; flex-grow: 1; }
        .nav-links li { margin-bottom: 8px; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-sidebar);
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            transition: all 0.25s ease;
            font-weight: 500;
        }
        .nav-links a i { margin-right: 12px; width: 20px; text-align: center; font-size: 16px; }
        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.12);
            color: white;
            transform: translateX(3px);
        }
        .nav-links a.active {
            border-left: 4px solid var(--primary);
            background: rgba(230, 126, 34, 0.16);
        }
        .user-info {
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.12);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logout-btn { color: #f5a9a1; text-decoration: none; }

        .main-content { flex: 1; padding: 32px 32px 40px; overflow-y: auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 14px;
        }
        header h1 { font-size: 28px; font-weight: 700; color: #1f2d3d; }

        .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .quick-actions button {
            background: linear-gradient(135deg, var(--primary) 0%, #f39c12 100%);
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-size: 14px;
            box-shadow: 0 8px 18px rgba(230, 126, 34, 0.22);
        }
        .quick-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(230, 126, 34, 0.28);
        }
        .btn-verde {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%) !important;
            box-shadow: 0 8px 18px rgba(46, 204, 113, 0.22) !important;
        }

        .view { display: none; }
        .view.active { display: block; }
        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.8);
            color: #2c3e50;
            font-size: 13px;
            font-weight: 600;
        }

        .hero-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 24px;
            border-radius: 22px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, rgba(230, 126, 34, 0.11) 0%, rgba(52, 152, 219, 0.12) 100%);
            border: 1px solid rgba(230, 126, 34, 0.12);
            box-shadow: var(--shadow);
        }
        .hero-panel h2 { font-size: 20px; color: #1f2d3d; margin-bottom: 8px; }
        .hero-panel p { color: #5c6b7a; line-height: 1.5; }
        .hero-badges { display: grid; gap: 8px; min-width: 230px; }
        .hero-badges .badge {
            background: rgba(255,255,255,0.9);
            color: #33475b;
            padding: 9px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background: linear-gradient(145deg, var(--card-bg) 0%, #f8fbff 100%);
            padding: 22px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 18px 35px rgba(15, 23, 42, 0.1); }
        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .card-info h3 { font-size: 12px; color: #7f8c8d; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
        .card-info p { font-size: 22px; font-weight: 700; color: var(--text-main); }

        .icon-balanco { background: rgba(230, 126, 34, 0.12); color: var(--primary); }
        .icon-receita { background: rgba(46, 204, 113, 0.12); color: #2ecc71; }
        .icon-despesa { background: rgba(231, 76, 60, 0.12); color: #e74c3c; }
        .icon-agenda { background: rgba(52, 152, 219, 0.12); color: #3498db; }

        .recent-section {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h2 { font-size: 18px; font-weight: 700; color: #243447; }
        .history-list { display: grid; gap: 12px; }
        .history-day {
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            background: #fbfdff;
        }
        .history-day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            color: #243447;
        }
        .history-meta { font-size: 13px; color: #6b7280; }
        .history-item {
            padding: 8px 0;
            border-top: 1px solid #eef2f7;
            font-size: 14px;
            color: #374151;
        }
        .history-item:first-child { border-top: none; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .summary-box {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }
        .summary-box strong { display: block; font-size: 18px; color: #243447; }
        .summary-box span { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .calendar-day {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            min-height: 88px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .calendar-day:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08); }
        .calendar-day.empty { background: #f8fafc; color: #9ca3af; cursor: default; }
        .calendar-day.has-agenda { border-color: var(--primary); background: #fff8f0; }
        .calendar-day.selected { border-color: var(--primary); box-shadow: inset 0 0 0 2px rgba(230, 126, 34, 0.22); background: #fff3e8; }
        .calendar-number { font-weight: 700; color: #243447; }
        .calendar-dot { color: var(--primary); font-size: 12px; font-weight: 700; }
        .detail-panel {
            margin-top: 14px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            background: #fcfdff;
        }
        .detail-panel h3 { font-size: 16px; color: #243447; margin-bottom: 8px; }
        .detail-list { display: grid; gap: 8px; margin-top: 10px; }
        .detail-item {
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: #374151;
        }
        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .calendar-controls button {
            border: none;
            background: #f3f4f6;
            color: #243447;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table th { text-align: left; padding: 12px; background: #f8fafc; color: #718096; font-weight: 700; border-bottom: 2px solid var(--border-color); }
        table td { padding: 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        table tr:last-child td { border-bottom: none; }
        table tbody tr:hover { background-color: #fcfdff; }

        .status { padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-block; }
        .status-pago { background: rgba(46, 204, 113, 0.12); color: #2ecc71; }
        .status-pendente { background: rgba(241, 196, 15, 0.16); color: #b7791f; }
        .status-servico { background: #e8f6ff; color: #0288d1; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.62); align-items: center; justify-content: center; padding: 20px; }
        .modal-content {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 18px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 16px 35px rgba(0,0,0,0.25);
            animation: deslizar 0.25s ease-out;
        }
        @keyframes deslizar { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-header h2 { font-size: 20px; color: #243447; }
        .close-btn { font-size: 28px; cursor: pointer; color: #95a5a6; border: none; background: none; }
        .close-btn:hover { color: #e74c3c; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #34495e; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #fbfdff;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.12); }
        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }
        .btn-salvar {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #f39c12 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-salvar:hover { filter: brightness(1.02); }
        .btn-limpar {
            background: white;
            border: 1px solid #f1b6b2;
            color: #d35400;
            padding: 7px 10px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-limpar:hover { background: #fff5f3; }
        .btn-apagar-linha {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s ease;
        }
        .btn-apagar-linha:hover { color: #c0392b; transform: scale(1.15); }
        .checkbox-group { display: grid; gap: 8px; margin-top: 8px; }
        .checkbox-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fbfdff;
        }
        .checkbox-item label { display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
        .checkbox-item small { color: #6b7280; font-size: 12px; }
        .textarea-observacoes {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            padding: 12px 13px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #fbfdff;
        }
        .obs-mini { font-size: 12px; color: #6b7280; margin-top: 4px; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; min-height: auto; padding: 16px; }
            .nav-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
            .nav-links li { margin-bottom: 0; }
            .nav-links a { justify-content: center; text-align: center; padding: 10px 8px; font-size: 13px; }
            .nav-links a i { margin-right: 6px; }
            .user-info { flex-direction: column; align-items: flex-start; gap: 6px; }
            .main-content { padding: 20px; }
            .hero-panel { flex-direction: column; align-items: flex-start; }
            .hero-badges { width: 100%; }
            .modal-content { padding: 20px; }
        }

        @media (max-width: 640px) {
            .main-content { padding: 14px; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .quick-actions { width: 100%; flex-direction: column; }
            .quick-actions button { width: 100%; justify-content: center; }
            .cards-grid { grid-template-columns: 1fr; gap: 14px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .recent-section { padding: 16px; }
            .history-day-header { flex-direction: column; align-items: flex-start; gap: 4px; }
            table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; font-size: 13px; }
            .calendar-grid { gap: 6px; }
            .calendar-day { min-height: 70px; padding: 8px; }
            .calendar-number { font-size: 13px; }
            .calendar-dot { font-size: 11px; }
            .form-row { flex-direction: column; gap: 0; }
            .login-card { padding: 22px; }
            .modal-content { padding: 18px; max-height: 90vh; overflow-y: auto; }
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2>Acesso Administrador</h2>
            <p>Entre com seu usuário e senha para continuar.</p>
            <input type="text" id="loginUser" placeholder="Usuário" value="admin">
            <input type="password" id="loginSenha" placeholder="Senha" value="dsouza2026">
            <button onclick="entrarAdmin()">Entrar</button>
            <p id="loginMessage" class="login-message"></p>
        </div>
    </div>

    <div id="appContent" class="app-shell hidden">
    <!-- --- ESTRUTURA DA TELA (HTML) --- -->
    <nav class="sidebar">
        <div class="brand">DSouza <span>Estética</span> 🏍️</div>
        <ul class="nav-links">
            <li><a href="#" class="active" onclick="trocarAba('dashboard', event)"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="#" onclick="trocarAba('agendamentos', event)"><i class="fas fa-calendar-alt"></i>
